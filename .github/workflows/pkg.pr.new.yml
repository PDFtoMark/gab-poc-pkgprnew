name: Publish to pkg.pr.new
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make output
        run: |
          printf '%s' '{"packages":[{"name":"poc-pkg","url":"https://pkg.pr.new/poc-pkg@deadbeef"}],"number":1,"sha":"deadbeef"}' > output.json
      - name: Upload output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output
          path: ./output.json
